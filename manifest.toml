#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "vaultwarden"
name = "Vaultwarden"
description.en = "Encrypted end-to-end password manager"
description.fr = "Gestionnaire de mots de passe chiffré de bout en bout"

version = "1.37.5~ynh2"

maintainers = [ ]

[upstream]
license = "GPL-3.0-or-later"
admindoc = "https://github.com/dani-garcia/vaultwarden/wiki"
userdoc = "https://help.bitwarden.com/"
code = "https://github.com/dani-garcia/vaultwarden"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "80M"
ram.runtime = "70M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/vaultwarden"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

    [install.sso_enabled]
    type = "boolean"
    ask.en = "Use Dex to handle authentication"
    ask.fr = "Utiliser Dex pour gérer l'authentification"
    
    [install.dex]
    type = "app"
    filter = "match(id, '^(dex)(__[0-9+])?$')"
    ask.en = "Select the Dex app that will handle authentication."
    ask.fr = "Sélectionnez l'app Dex qui gérera l'authentification."
    help.en = "You need to have at least one instance of Dex installed beforehand on your server. You will need to disable a Dex's security feature to use it with vaultwarden"
    help.fr = "Vous devez avoir au moins une instance de Dex préalablement installée sur votre serveur. Il faudra désactiver une sécurité de Dex pour l'utiliser avec vaultwarden"
    optional = true
    visible = "sso_enabled"

[resources]

    [resources.sources]

    [resources.sources.main]
    #https://github.com/czyt/vaultwarden-binary/
    in_subdir = false
    amd64.url = "https://github.com/czyt/vaultwarden-binary/releases/download/1.37.5-extracted/vaultwarden-linux-amd64-extracted.zip"
    amd64.sha256 = "f60815f717ddf28c6ac12e4463d3474a3467504113170a086165fdece62e3b7a"
    arm64.url = "https://github.com/czyt/vaultwarden-binary/releases/download/1.37.5-extracted/vaultwarden-linux-arm64-extracted.zip"
    arm64.sha256 = "e50b8f2850bbc5614f2d3d50c8521ed2d01ef2d7ab777cfb0319c6bfbeb92456"
    armhf.url = "https://github.com/czyt/vaultwarden-binary/releases/download/1.37.5-extracted/vaultwarden-linux-armv7-extracted.zip"
    armhf.sha256 = "169ce80a11aa6c452cae6a2e8e2721a0e5869bbad21da9cbb7bd1cd59586d33b"

    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/czyt/vaultwarden-binary"
    autoupdate.asset.amd64 = "^vaultwarden-linux-amd64-extracted.zip"
    autoupdate.asset.arm64 = "^vaultwarden-linux-arm64-extracted.zip"
    autoupdate.asset.armhf = "^vaultwarden-linux-armv7-extracted.zip"
    autoupdate.version_regex="(\\d+\\.\\d+\\.\\d+)-extracted"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.ports]

    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.additional_urls = [ "/identity" ]
    api.allowed = "visitors"
    api.auth_header = false
    api.show_tile = false
    api.protected = true
    admin.url = "/admin"
    admin.allowed = "admins"
    admin.show_tile = false

    [resources.apt]
    packages = "argon2"
